version: "2"
type: frontend
tech_stack:
  - Language: TypeScript / JavaScript
  - Framework: Next.js (App Router)
  - Styling: CSS (Vanilla/PostCSS)
  - State Management: React Hooks, Zod, Zube (Firebase Realtime SDK)
routes:
  - path: /login
    file: client/src/app/login/page.tsx
    auth_required: false
    description: User authentication and login page
  - path: /competitions
    file: client/src/app/competitions/page.tsx
    auth_required: true
    description: View and manage all tournaments/competitions
  - path: /setup/[id]
    file: client/src/app/setup/[id]/page.tsx
    auth_required: true
    description: Setup wizard for configuring tournament details, categories, brackets, and schedule
  - path: /competitions/[id]/operator
    file: client/src/app/competitions/[id]/operator/page.tsx
    auth_required: true
    description: Real-time operator console for running matches, modifying scores, and managing mats
features:
  - name: Tournament Setup Wizard
    description: Setup days, categories, schedule rules, and compile/generate match tiesheets
    files:
      - client/src/app/setup/[id]/page.tsx
    entry_route: /setup/[id]
    user_interactions:
      - Pick date range with travel-style DateRangePicker calendar
      - Create categories, upload files, configure judge counts
      - Save drafts and deploy to production
    api_calls:
      - method: POST
        endpoint: /api/gateway
    auth_required: true
  - name: Real-time Scoreboard and Operator Console
    description: Dynamic match flow management, scoring, and judge pad sync
    files:
      - client/src/app/competitions/[id]/operator/page.tsx
    entry_route: /competitions/[id]/operator
    user_interactions:
      - Drag and drop matches between mat queues
      - Start and pause matches, update score points and penalties
    api_calls:
      - method: POST
        endpoint: /api/gateway
    auth_required: true
known_limitations: []

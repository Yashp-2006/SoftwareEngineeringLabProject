<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaiKaiX — Athletes</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .athletes-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: var(--space-5);
      align-items: start;
    }

    .category-panel {
      background: var(--shiro);
      border: 1px solid var(--neutral-300);
      border-radius: 12px;
      padding: var(--space-4);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      position: sticky;
      top: 130px;
    }

    .category-button {
      width: 100%;
      border: 1px solid var(--neutral-300);
      background: var(--shiro);
      border-radius: 10px;
      padding: 12px;
      text-align: left;
      cursor: pointer;
      margin-bottom: var(--space-2);
      transition: all 0.2s;
    }

    .category-button:hover { border-color: var(--ao); }
    .category-button.active {
      border-color: var(--aka);
      background: var(--aka-light);
      box-shadow: 0 0 0 1px var(--aka-light);
    }

    .category-name {
      font-weight: 600;
      color: var(--neutral-900);
      font-size: 14px;
      margin-bottom: 4px;
    }

    .category-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--neutral-500);
      font-weight: 600;
    }

    .athletes-panel {
      background: var(--shiro);
      border: 1px solid var(--neutral-300);
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    .athletes-panel-header {
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--neutral-300);
      background: var(--neutral-50);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-3);
    }

    .athletes-panel-header h2 {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
    }

    .search-wrap {
      position: relative;
      width: 320px;
      max-width: 100%;
    }

    .search-wrap i {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--neutral-500);
      width: 14px;
    }

    .search-input {
      width: 100%;
      height: 38px;
      border: 1.5px solid var(--neutral-300);
      border-radius: 8px;
      padding: 0 12px 0 32px;
      font-size: 13px;
      font-family: var(--font-body);
      color: var(--neutral-900);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--ao);
      box-shadow: 0 0 0 3px rgba(26,77,181,0.12);
    }

    table.athlete-table {
      width: 100%;
      border-collapse: collapse;
    }

    .athlete-table thead th {
      text-align: left;
      padding: 12px 24px;
      background: var(--neutral-50);
      border-bottom: 1px solid var(--neutral-300);
    }

    .athlete-table tbody td {
      padding: 14px 24px;
      border-bottom: 1px solid var(--neutral-100);
      font-size: 14px;
      color: var(--neutral-900);
      vertical-align: middle;
    }

    .athlete-table tbody tr:hover { background: var(--neutral-50); }
    .athlete-table tbody tr:last-child td { border-bottom: none; }

    .academy-name {
      color: var(--neutral-500);
      font-size: 13px;
    }

    .attendance-control {
      display: inline-flex;
      border: 1px solid var(--neutral-300);
      border-radius: 999px;
      padding: 2px;
      background: var(--shiro);
      gap: 2px;
    }

    .attendance-btn {
      border: none;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      background: transparent;
      color: var(--neutral-500);
    }

    .attendance-btn.present.active {
      background: var(--status-live-bg);
      color: var(--status-live);
    }

    .attendance-btn.absent.active {
      background: var(--aka-light);
      color: var(--aka);
    }

    .attendance-btn.neutral.active {
      background: var(--neutral-200);
      color: var(--neutral-700);
    }

    .empty-state {
      padding: var(--space-6);
      text-align: center;
      color: var(--neutral-500);
      font-size: 14px;
    }

    @media (max-width: 1100px) {
      .athletes-layout { grid-template-columns: 1fr; }
      .category-panel {
        position: static;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: var(--space-2);
      }
      .category-button { margin-bottom: 0; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-logo">TAIKAIX</div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="competitions.html" class="nav-link active">Competitions</a>
      <a href="users.html" class="nav-link">Users</a>
    </div>
    <div class="nav-profile">
      <a href="taikaix-profile.html" class="avatar" style="border: 2px solid transparent; transition: border-color 0.2s;"></a>
      <i data-lucide="chevron-down" style="width: 16px; color: var(--neutral-500);"></i>
    </div>
  </nav>

  <div class="sub-nav">
    <a href="competition-detail.html" class="sub-nav-link">Overview</a>
    <a href="categories.html" class="sub-nav-link">Categories</a>
    <a href="bracket.html" class="sub-nav-link">Tiesheet</a>
    <a href="mats-grid.html" class="sub-nav-link">Mats</a>
    <a href="taikaix-live-staff.html" class="sub-nav-link">Staff</a>
    <a href="athletes.html" class="sub-nav-link active">Athletes</a>
    <a href="medals.html" class="sub-nav-link">Medals</a>
    <a href="schedule.html" class="sub-nav-link">Schedule</a>
    <div style="flex: 1;"></div>
  </div>

  <main class="container">
    <header class="page-header">
      <div>
        <div class="breadcrumb">Kyoto 2026 Finals / Operations</div>
        <h1>Athletes Attendance</h1>
      </div>
    </header>

    <section class="athletes-layout">
      <aside class="category-panel" id="category-panel"></aside>

      <div class="athletes-panel">
        <div class="athletes-panel-header">
          <div>
            <h2 id="active-category-name">Senior Male Kumite -75kg</h2>
            <div class="text-small" id="active-category-meta">Kyoto 2026 Finals</div>
          </div>
          <div class="search-wrap">
            <i data-lucide="search"></i>
            <input id="athlete-search" class="search-input" type="text" placeholder="Search athlete or academy...">
          </div>
        </div>

        <table class="athlete-table">
          <thead>
            <tr>
              <th class="text-micro">Athlete Name</th>
              <th class="text-micro">Academy</th>
              <th class="text-micro">Present / Absent</th>
              <th class="text-micro">Ready / Not Ready</th>
              <th class="text-micro">Disqualify</th>
            </tr>
          </thead>
          <tbody id="athlete-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const categoryData = [
      {
        id: "smk-75",
        name: "Senior Male Kumite -75kg",
        mat: "MAT 01",
        status: "LIVE",
        athletes: [
          { id: "A001", name: "Takumi Sato", academy: "Kyoto Shotokan Club", attendance: "present", readiness: "ready", disqualified: false },
          { id: "A002", name: "Miguel Rossi", academy: "Roma Karate Dojo", attendance: "present", readiness: "not-ready", disqualified: true },
          { id: "A003", name: "Jaden Smith", academy: "LA Combat Academy", attendance: "absent", readiness: "not-ready", disqualified: false },
          { id: "A004", name: "Leon Silva", academy: "Sao Paulo Kumite Lab", attendance: "present", readiness: "ready", disqualified: false }
        ]
      },
      {
        id: "sfk-55",
        name: "Senior Female Kumite -55kg",
        mat: "MAT 02",
        status: "LIVE",
        athletes: [
          { id: "B011", name: "Aiko Tanaka", academy: "Osaka Elite Dojo", attendance: "present", readiness: "ready", disqualified: false },
          { id: "B012", name: "Maria Garcia", academy: "Madrid Kensei Club", attendance: "present", readiness: "not-ready", disqualified: false },
          { id: "B013", name: "Elena Costa", academy: "Lisbon Karate Center", attendance: "absent", readiness: "not-ready", disqualified: false }
        ]
      },
      {
        id: "smk-67",
        name: "U21 Male Kumite -67kg",
        mat: "UNASSIGNED",
        status: "UPCOMING",
        athletes: [
          { id: "C031", name: "Ren Kobayashi", academy: "Nagoya Budo Academy", attendance: "present", readiness: "not-ready", disqualified: false },
          { id: "C032", name: "Arjun Mehta", academy: "Delhi Fighting Arts", attendance: "present", readiness: "ready", disqualified: false },
          { id: "C033", name: "Noah Kim", academy: "Seoul Kumite Studio", attendance: "present", readiness: "not-ready", disqualified: true },
          { id: "C034", name: "Luca Bruno", academy: "Torino Kata Works", attendance: "absent", readiness: "not-ready", disqualified: false }
        ]
      }
    ];

    let activeCategoryId = categoryData[0].id;
    const categoryPanel = document.getElementById("category-panel");
    const tableBody = document.getElementById("athlete-table-body");
    const activeCategoryName = document.getElementById("active-category-name");
    const activeCategoryMeta = document.getElementById("active-category-meta");
    const searchInput = document.getElementById("athlete-search");

    function buildCategoryPanel() {
      categoryPanel.innerHTML = categoryData.map((category) => {
        const isActive = category.id === activeCategoryId ? "active" : "";
        return `
          <button class="category-button ${isActive}" data-category-id="${category.id}">
            <div class="category-name">${category.name}</div>
            <div class="category-meta">
              <span>${category.mat}</span>
              <span>${category.status}</span>
            </div>
          </button>
        `;
      }).join("");

      categoryPanel.querySelectorAll(".category-button").forEach((button) => {
        button.addEventListener("click", () => {
          activeCategoryId = button.dataset.categoryId;
          searchInput.value = "";
          render();
        });
      });
    }

    function buildAttendanceControl(categoryId, athleteId, currentStatus) {
      const isPresent = currentStatus === "present" ? "active" : "";
      const isAbsent = currentStatus === "absent" ? "active" : "";
      return `
        <div class="attendance-control">
          <button class="attendance-btn present ${isPresent}" data-category-id="${categoryId}" data-athlete-id="${athleteId}" data-field="attendance" data-value="present">Present</button>
          <button class="attendance-btn absent ${isAbsent}" data-category-id="${categoryId}" data-athlete-id="${athleteId}" data-field="attendance" data-value="absent">Absent</button>
        </div>
      `;
    }

    function buildReadinessControl(categoryId, athleteId, currentStatus) {
      const isReady = currentStatus === "ready" ? "active" : "";
      const isNotReady = currentStatus === "not-ready" ? "active" : "";
      return `
        <div class="attendance-control">
          <button class="attendance-btn present ${isReady}" data-category-id="${categoryId}" data-athlete-id="${athleteId}" data-field="readiness" data-value="ready">Ready</button>
          <button class="attendance-btn neutral ${isNotReady}" data-category-id="${categoryId}" data-athlete-id="${athleteId}" data-field="readiness" data-value="not-ready">Not Ready</button>
        </div>
      `;
    }

    function buildDisqualifyControl(categoryId, athleteId, isDisqualified) {
      const dqClass = isDisqualified ? "active" : "";
      return `
        <div class="attendance-control">
          <button class="attendance-btn absent ${dqClass}" data-category-id="${categoryId}" data-athlete-id="${athleteId}" data-field="disqualified" data-value="${!isDisqualified}">
            ${isDisqualified ? 'Disqualified' : 'Disqualify'}
          </button>
        </div>
      `;
    }

    function buildTable() {
      const category = categoryData.find((item) => item.id === activeCategoryId);
      const query = searchInput.value.trim().toLowerCase();
      const rows = category.athletes.filter((athlete) => {
        if (!query) return true;
        return athlete.name.toLowerCase().includes(query) || athlete.academy.toLowerCase().includes(query);
      });

      activeCategoryName.textContent = category.name;
      activeCategoryMeta.textContent = `${category.mat} • ${category.status} • ${rows.length} athletes`;

      if (!rows.length) {
        tableBody.innerHTML = `<tr><td colspan="5" class="empty-state">No athletes found for this filter.</td></tr>`;
        return;
      }

      tableBody.innerHTML = rows.map((athlete) => `
        <tr>
          <td>${athlete.name}</td>
          <td class="academy-name">${athlete.academy}</td>
          <td>${buildAttendanceControl(category.id, athlete.id, athlete.attendance)}</td>
          <td>${buildReadinessControl(category.id, athlete.id, athlete.readiness || "not-ready")}</td>
          <td>${buildDisqualifyControl(category.id, athlete.id, !!athlete.disqualified)}</td>
        </tr>
      `).join("");

      tableBody.querySelectorAll(".attendance-btn").forEach((button) => {
        button.addEventListener("click", () => {
          const { categoryId, athleteId, field, value } = button.dataset;
          const targetCategory = categoryData.find((item) => item.id === categoryId);
          const targetAthlete = targetCategory.athletes.find((item) => item.id === athleteId);
          if (field === 'disqualified') {
            targetAthlete[field] = value === 'true';
          } else {
            targetAthlete[field] = value;
          }
          buildTable();
        });
      });
    }

    function render() {
      buildCategoryPanel();
      buildTable();
      lucide.createIcons();
    }

    searchInput.addEventListener("input", buildTable);
    render();
  </script>
</body>
</html>

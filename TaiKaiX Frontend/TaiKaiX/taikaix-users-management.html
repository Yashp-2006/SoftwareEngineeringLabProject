
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaiKaiX — Users</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .users-panel {
      background: var(--shiro);
      border: 1px solid var(--neutral-300);
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }

    .users-header {
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--neutral-300);
      background: var(--neutral-50);
      display: grid;
      gap: var(--space-3);
      grid-template-columns: minmax(260px, 1fr) 220px 220px;
      align-items: center;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap i {
      position: absolute;
      left: 12px;
      top: 11px;
      width: 16px;
      color: var(--neutral-500);
    }

    .search-input,
    .filter-select,
    .role-select,
    .academy-select {
      height: 40px;
      border: 1.5px solid var(--neutral-300);
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--neutral-900);
      background: var(--shiro);
      outline: none;
    }

    .search-input {
      width: 100%;
      padding: 0 12px 0 38px;
    }

    .filter-select,
    .role-select,
    .academy-select {
      width: 100%;
      padding: 0 10px;
    }

    .search-input:focus,
    .filter-select:focus,
    .role-select:focus,
    .academy-select:focus {
      border-color: var(--ao);
      box-shadow: 0 0 0 3px rgba(26, 77, 181, 0.12);
    }

    .users-table {
      width: 100%;
      border-collapse: collapse;
    }

    .users-table th {
      text-align: left;
      padding: 12px 24px;
      background: var(--neutral-50);
      border-bottom: 1px solid var(--neutral-300);
    }

    .users-table td {
      padding: 14px 24px;
      border-bottom: 1px solid var(--neutral-100);
      vertical-align: middle;
    }

    .users-table tr:hover {
      background: var(--neutral-50);
    }

    .saved-chip {
      font-size: 11px;
      font-weight: 700;
      color: var(--status-live);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .saved-chip.visible {
      opacity: 1;
    }

    .email-cell {
      font-weight: 500;
      color: var(--neutral-900);
    }

    .empty-state {
      padding: var(--space-6);
      text-align: center;
      color: var(--neutral-500);
      font-size: 14px;
    }

    @media (max-width: 980px) {
      .users-header {
        grid-template-columns: 1fr;
      }

      .users-panel {
        overflow-x: auto;
      }

      .users-table {
        min-width: 900px;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-logo">TAIKAIX</div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="competitions.html" class="nav-link">Competitions</a>
      <a href="users.html" class="nav-link active">Users</a>
    </div>
    <div class="nav-profile">
      <a href="taikaix-profile.html" class="avatar" style="border: 2px solid transparent; transition: border-color 0.2s;"></a>
      <i data-lucide="chevron-down" style="width: 16px; color: var(--neutral-500);"></i>
    </div>
  </nav>

  <main class="container">
    <header class="page-header">
      <div>
        <div class="breadcrumb">Admin / Users</div>
        <h1>User Assignment</h1>
      </div>
    </header>

    <section class="users-panel">
      <div class="users-header">
        <div class="search-wrap">
          <i data-lucide="search"></i>
          <input id="search-input" class="search-input" type="text" placeholder="Search by user email or academy...">
        </div>
        <select id="role-filter" class="filter-select">
          <option value="all">Filter by Role (All)</option>
        </select>
        <select id="academy-filter" class="filter-select">
          <option value="all">Filter by Academy (All)</option>
        </select>
      </div>

      <table class="users-table">
        <thead>
          <tr>
            <th class="text-micro">User Email / Gmail</th>
            <th class="text-micro">Role</th>
            <th class="text-micro">Academy</th>
            <th class="text-micro">Status</th>
          </tr>
        </thead>
        <tbody id="users-table-body"></tbody>
      </table>
      <div id="empty-state" class="empty-state" style="display: none;">No users match the selected filters.</div>
    </section>
  </main>

  <script>
    const roles = ["Admin", "Tournament Director", "Referee", "Mat Operator", "Coach", "Viewer"];
    const academies = [
      "Kyoto Shotokan Club",
      "Osaka Budokan Academy",
      "Tokyo Seido Dojo",
      "Nara Combat Academy",
      "Kobe Wadoryu Center",
      "International Guest Team"
    ];

    const users = [
      { id: "U001", email: "naoki.admin@gmail.com", role: "Admin", academy: "Kyoto Shotokan Club" },
      { id: "U002", email: "aiko.director@gmail.com", role: "Tournament Director", academy: "Osaka Budokan Academy" },
      { id: "U003", email: "ren.referee@gmail.com", role: "Referee", academy: "Tokyo Seido Dojo" },
      { id: "U004", email: "mei.operator@gmail.com", role: "Mat Operator", academy: "Nara Combat Academy" },
      { id: "U005", email: "takeshi.coach@gmail.com", role: "Coach", academy: "Kyoto Shotokan Club" },
      { id: "U006", email: "hana.viewer@gmail.com", role: "Viewer", academy: "International Guest Team" },
      { id: "U007", email: "sora.operator@gmail.com", role: "Mat Operator", academy: "Kobe Wadoryu Center" },
      { id: "U008", email: "emma.referee@gmail.com", role: "Referee", academy: "International Guest Team" }
    ];

    const searchInput = document.getElementById("search-input");
    const roleFilter = document.getElementById("role-filter");
    const academyFilter = document.getElementById("academy-filter");
    const usersTableBody = document.getElementById("users-table-body");
    const emptyState = document.getElementById("empty-state");

    function optionList(values, selected) {
      return values.map((value) => `<option value="${value}" ${value === selected ? "selected" : ""}>${value}</option>`).join("");
    }

    function hydrateFilters() {
      roleFilter.innerHTML += roles.map((role) => `<option value="${role}">${role}</option>`).join("");
      academyFilter.innerHTML += academies.map((academy) => `<option value="${academy}">${academy}</option>`).join("");
    }

    function flashSaved(rowId) {
      const chip = document.querySelector(`[data-row-id="${rowId}"] .saved-chip`);
      if (!chip) return;
      chip.classList.add("visible");
      setTimeout(() => chip.classList.remove("visible"), 1000);
    }

    function renderRows() {
      const query = searchInput.value.trim().toLowerCase();
      const roleValue = roleFilter.value;
      const academyValue = academyFilter.value;

      const filtered = users.filter((user) => {
        const textMatch = !query || user.email.toLowerCase().includes(query) || user.academy.toLowerCase().includes(query);
        const roleMatch = roleValue === "all" || user.role === roleValue;
        const academyMatch = academyValue === "all" || user.academy === academyValue;
        return textMatch && roleMatch && academyMatch;
      });

      usersTableBody.innerHTML = filtered.map((user) => `
        <tr data-row-id="${user.id}">
          <td class="email-cell">${user.email}</td>
          <td>
            <select class="role-select" data-id="${user.id}" data-field="role">
              ${optionList(roles, user.role)}
            </select>
          </td>
          <td>
            <select class="academy-select" data-id="${user.id}" data-field="academy">
              ${optionList(academies, user.academy)}
            </select>
          </td>
          <td><span class="saved-chip">Saved</span></td>
        </tr>
      `).join("");

      emptyState.style.display = filtered.length === 0 ? "block" : "none";

      usersTableBody.querySelectorAll("select[data-id]").forEach((selectEl) => {
        selectEl.addEventListener("change", () => {
          const user = users.find((item) => item.id === selectEl.dataset.id);
          if (!user) return;
          user[selectEl.dataset.field] = selectEl.value;
          flashSaved(user.id);
        });
      });
    }

    searchInput.addEventListener("input", renderRows);
    roleFilter.addEventListener("change", renderRows);
    academyFilter.addEventListener("change", renderRows);

    hydrateFilters();
    renderRows();
    lucide.createIcons();
  </script>
</body>
</html>
